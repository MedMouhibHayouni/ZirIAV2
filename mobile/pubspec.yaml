name: ziria_mobile
description: ZirIA Sentinel V2.0 — Application AgriTech terrain production-grade
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.5

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Database & Offline
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # UI / Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  animated_text_kit: ^4.2.2

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Camera & Images
  image_picker: ^1.1.2

  # Charts
  fl_chart: ^0.68.0

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.1

  # Share
  share_plus: ^9.0.0

  # Intl
  intl: ^0.20.2

  # url_launcher: ^6.3.0

  # Firebase (Bypassed for Windows build stability)
  # firebase_core: ^2.30.1
  # firebase_messaging: ^14.9.1

  # Socket.IO for real-time notifications
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/models/ziria_disease_model.tflite
    - assets/images/
    - assets/images/ziria-logo.png
    - assets/images/ziria-icon.png
