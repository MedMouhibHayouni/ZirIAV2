# fly.toml — ZirIA MLOps Inference Microservice
# Deploy with: fly launch (first time) or fly deploy (updates)

app = "ziria-mlops"
primary_region = "cdg"   # Paris — closest to Tunisia

[build]
  dockerfile = "Dockerfile"

[env]
  PORT       = "8000"
  MODELS_DIR = "/app/models"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = true    # Free-tier friendly: sleeps when idle
  auto_start_machines  = true
  min_machines_running = 0       # Scales to zero (free)

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 20
    hard_limit = 50

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"    # Enough for XGBoost + Prophet inference

[mounts]
  source      = "models_volume"
  destination = "/app/models"
