<div class="storage-facility-container">
  <div class="header-actions">
    <div>
      <h2>Mon Site de Stockage</h2>
      <p class="subtitle">Gestion des coordonnées GPS, adresse et photos de votre installation frigo</p>
    </div>

    <div class="actions-right">
      <select [ngModel]="selectedFacilityId()" (ngModelChange)="onSelectFacility($event)" *ngIf="facilities().length > 0" class="select-facility">
        <option *ngFor="let f of facilities()" [value]="f.id">{{ f.name }}</option>
      </select>
      <button class="btn-secondary" (click)="resetFormForNew()">
        <ng-icon name="lucidePlus" size="16" /> Nouveau Site
      </button>
    </div>
  </div>

  <div class="card-box">
    <div class="form-grid">
      <div class="form-group span-2">
        <label>Nom du Site *</label>
        <input type="text" [(ngModel)]="formFacility.name" placeholder="Ex: Complexe Frigorifique Kasserine Nord" class="form-input" />
      </div>

      <div class="form-group">
        <label>Gouvernorat *</label>
        <select [(ngModel)]="formFacility.governorate" class="form-input">
          <option *ngFor="let g of governoratesList" [value]="g">{{ g }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Délégation</label>
        <input type="text" [(ngModel)]="formFacility.delegation" placeholder="Ex: Sbeitla, Kasserine Nord" class="form-input" />
      </div>

      <div class="form-group">
        <label>Latitude GPS</label>
        <input type="number" step="0.000001" [(ngModel)]="formFacility.latitude" class="form-input" />
      </div>

      <div class="form-group">
        <label>Longitude GPS</label>
        <input type="number" step="0.000001" [(ngModel)]="formFacility.longitude" class="form-input" />
      </div>
    </div>

    <!-- Photos Upload (JSONB media_items standard) -->
    <div class="photos-section">
      <h3>Photos du Site (Format Media Items JSONB)</h3>
      <p class="help-text">Ajoutez des URLs de photos de votre site frigorifique pour l'affichage vitrine.</p>

      <div class="add-photo-bar">
        <input type="text" [(ngModel)]="newPhotoUrl" placeholder="https://..." class="form-input" />
        <button class="btn-primary" (click)="addPhoto()">
          <ng-icon name="lucidePlus" size="16" /> Ajouter Photo
        </button>
      </div>

      <div class="photos-grid">
        <div class="photo-card" *ngFor="let p of formFacility.photos; let i = index">
          <img [src]="p.url" alt="Photo site" />
          <button class="btn-del" (click)="removePhoto(i)">
            <ng-icon name="lucideTrash2" size="14" />
          </button>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-primary btn-save" (click)="saveFacility()">
        <ng-icon name="lucideSave" size="16" /> Enregistrer les Modifications
      </button>
    </div>
  </div>
</div>
