<div class="min-h-screen flex flex-col bg-gradient-to-b from-slate-50 to-emerald-50
            dark:from-slate-950 dark:to-emerald-950/30">

  <!-- Minimalist Topbar -->
  <header class="sticky top-0 z-40 flex items-center justify-between px-5 py-3
                 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md
                 border-b border-slate-200/50 dark:border-white/10">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-gradient-to-tr from-emerald-600 to-emerald-400 rounded-xl
                  flex items-center justify-center shadow-md shadow-emerald-500/30">
        <span class="text-white font-black text-sm">Z</span>
      </div>
      <div>
        <span class="font-bold text-slate-800 dark:text-white text-base leading-none block">ZirIA</span>
        <span class="text-xs text-emerald-500 font-semibold">Terrain</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center">
        <span class="text-white font-bold text-xs">{{ userName[0] }}</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto pb-24">
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom Navigation Bar — iOS/Android Style -->
  <nav class="fixed bottom-0 inset-x-0 z-50 flex items-center justify-around
              bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl
              border-t border-slate-200/50 dark:border-white/10
              pb-safe px-2" style="padding-bottom: env(safe-area-inset-bottom, 16px)">

    <!-- Accueil -->
    <a routerLink="/dashboard/ambassador"
       class="flex flex-col items-center gap-1 px-6 py-3 text-slate-400 dark:text-slate-500
              hover:text-emerald-500 transition-colors">
      <ng-icon name="lucideHome" class="text-2xl"></ng-icon>
      <span class="text-xs font-medium">Accueil</span>
    </a>

    <!-- DIAGNOSTIQUER — Centre FAB -->
    <div class="relative flex flex-col items-center -mt-6">
      <a routerLink="/dashboard/ambassador"
         fragment="diagnostiquer"
         class="w-16 h-16 bg-gradient-to-tr from-emerald-600 to-emerald-400 rounded-full
                flex items-center justify-center shadow-xl shadow-emerald-500/50
                active:scale-95 transition-transform border-4 border-white dark:border-slate-900">
        <ng-icon name="lucideScanLine" class="text-white text-3xl"></ng-icon>
      </a>
      <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 mt-1">Scanner</span>
    </div>

    <!-- Profil -->
    <button (click)="auth.logout()"
            class="flex flex-col items-center gap-1 px-6 py-3 text-slate-400 dark:text-slate-500
                   hover:text-red-400 transition-colors">
      <ng-icon name="lucideUserCircle2" class="text-2xl"></ng-icon>
      <span class="text-xs font-medium">Profil</span>
    </button>
  </nav>
</div>
