<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>ZirIA Sentinel — Plateforme AgriTech</title>
  <meta name="description" content="ZirIA Sentinel V2.0 — Le Système d'Exploitation Rural Numérique de Kasserine. Gestion intelligente des coopératives, parcelles, marchés et diagnostics IA.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/ziria-icon.png">
  <link rel="apple-touch-icon" href="assets/ziria-icon.png">
  <meta property="og:image" content="assets/ziria-logo.png">
  <meta property="og:title" content="ZirIA Sentinel — Plateforme AgriTech">
  <meta property="og:description" content="Le Système d'Exploitation Rural Numérique de Kasserine.">

  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter: data, UI — Tajawal: Arabic/Darija RTL -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <!--
    Anti-FOUC (Flash of Unstyled Content) — Dark Mode
    Ce script s'exécute AVANT tout rendu Angular pour appliquer le thème
    immédiatement depuis le localStorage, évitant tout flash blanc/noir.
  -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('zir-theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {}
    })();
  </script>

  <!-- Global polyfill -->
  <script>
    if (typeof global === 'undefined') { window.global = window; }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
